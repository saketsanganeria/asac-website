<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Agarwal Sanganeria & Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Agarwal Sanganeria & Co. for institutional advisory, forensic expertise and AI-enabled governance frameworks.">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-800">

  <!-- Header -->
  <div id="header"></div>

  <!-- Banner -->
  <section class="relative h-[50vh] flex items-center justify-center text-white text-center">
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d"
         class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/60"></div>

    <div class="relative z-10 px-6">
      <h1 class="text-4xl md:text-5xl font-semibold tracking-tight">
        Contact Us
      </h1>
    </div>
  </section>

  <!-- Introduction -->
  <section class="max-w-6xl mx-auto px-6 py-20 text-center">
    <h2 class="text-3xl font-semibold mb-8">
      Institutional Advisory Enquiries
    </h2>

    <p class="text-lg text-gray-600 leading-relaxed max-w-4xl mx-auto">
      For internal audit mandates, forensic engagements, regulatory
      advisory or AI-enabled governance transformation discussions,
      please reach out to us using the form below.
    </p>
  </section>

  <!-- Contact Form -->
  <section class="bg-gray-50 py-20">
    <div class="max-w-3xl mx-auto px-6">

      <h2 class="text-2xl font-semibold mb-8 text-center">
        Send an Enquiry
      </h2>

      <form class="space-y-6">

        <div>
          <label class="block text-sm font-medium mb-2">Full Name</label>
          <input type="text"
                 class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Email Address</label>
          <input type="email"
                 class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Organisation</label>
          <input type="text"
                 class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Nature of Enquiry</label>
          <textarea rows="5"
                    class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-black"></textarea>
        </div>

        <div class="text-center">
          <button type="submit"
                  class="bg-black text-white px-8 py-3 rounded hover:bg-gray-800 transition">
            Submit Enquiry
          </button>
        </div>

      </form>

    </div>
  </section>

  <!-- Offices -->
  <section class="max-w-6xl mx-auto px-6 py-20 text-center">
    <h2 class="text-3xl font-semibold mb-8">
      Our Offices
    </h2>

    <p class="text-lg text-gray-600 leading-relaxed">
      Kolkata<br>
      Mumbai<br>
      Hyderabad<br>
      Bangalore
    </p>
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Fetch Header & Footer -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {

    fetch("header.html")
      .then(r => r.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;

        const btn = document.getElementById("menuBtn");
        const menu = document.getElementById("mobileMenu");

        if (btn) {
          btn.addEventListener("click", function() {
            menu.classList.toggle("hidden");
          });
        }
      });

    fetch("footer.html")
      .then(r => r.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });

  });
  </script>

</body>
</html>
