<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<meta name="description" content="Contact ASAC">
<script src="https://cdn.tailwindcss.com"></script>
<style>
html { scroll-behavior: smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
h1 { font-size: 2.8rem; font-weight: 600; }
.section { padding: 6rem 0; }
.fade-in { animation: fade 1.2s ease-in; }
@keyframes fade { from {opacity:0;} to {opacity:1;} }
.accent { color: #111827; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="header"></div>

<section class="relative h-80 bg-cover bg-center fade-in" style="background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d');">
  <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
    <h1 class="text-white text-4xl font-semibold">Contact</h1>
  </div>
</section>


<section class="section max-w-5xl mx-auto px-6">
  <p class="text-lg text-gray-600 leading-relaxed">
    Detailed institutional advisory content aligned with enterprise governance, regulatory discipline and strategic clarity.
  </p>
</section>


<div id="footer"></div>

<script>
fetch("header.html").then(r=>r.text()).then(d=>document.getElementById("header").innerHTML=d);
fetch("footer.html").then(r=>r.text()).then(d=>document.getElementById("footer").innerHTML=d);
</script>

</body>
</html>
