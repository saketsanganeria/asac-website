<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | ASAC</title>
<meta name="description" content="Contact">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">

<div id="header"></div>

<section class="relative h-56 md:h-72 lg:h-80 bg-cover bg-center" style="background-image:url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d')">
  <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
    <h1 class="text-white text-3xl md:text-4xl font-semibold">Contact Us</h1>
  </div>
</section>

<section class="max-w-6xl mx-auto px-6 py-16 text-lg text-gray-700 leading-relaxed">

<form class="space-y-6">
<input type="text" placeholder="Name" class="w-full border p-3 rounded">
<input type="email" placeholder="Email" class="w-full border p-3 rounded">
<textarea rows="5" placeholder="Message" class="w-full border p-3 rounded"></textarea>
<button class="bg-black text-white px-6 py-3 rounded">Submit</button>
</form>

</section>

<div id="footer"></div>

<script>
fetch("header.html").then(r=>r.text()).then(d=>document.getElementById("header").innerHTML=d);
fetch("footer.html").then(r=>r.text()).then(d=>document.getElementById("footer").innerHTML=d);
</script>

</body>
</html>
