<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Expertise | ASAC</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>

<body class="bg-white text-gray-900">

<div class="absolute inset-0 bg-black/50 flex items-center justify-center">
<h1 class="text-white text-4xl font-semibold">Sector Expertise</h1>
</div>
</section>


<section class="section max-w-5xl mx-auto px-6 text-lg text-gray-700 leading-relaxed">
<p>Detailed institutional advisory content aligned with governance, regulatory discipline and enterprise resilience.</p>
</section>


<div id="footer"></div>

<script>
fetch("header.html").then(r=>r.text()).then(d=>document.getElementById("header").innerHTML=d);
fetch("footer.html").then(r=>r.text()).then(d=>document.getElementById("footer").innerHTML=d);
</script>

</body>
</html>
