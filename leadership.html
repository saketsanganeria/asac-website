<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadership | ASAC</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial; }
.section { padding: 6rem 0; }
.fade { animation: fade 1.2s ease-in; }
@keyframes fade { from {opacity:0;} to {opacity:1;} }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="header"></div>

<section class="relative h-80 bg-cover bg-center fade" style="background-image:url('https://images.unsplash.com/photo-1507679799987-c73779587ccf');">
<div class="absolute inset-0 bg-black/50 flex items-center justify-center">
<h1 class="text-white text-4xl font-semibold">Leadership</h1>
</div>
</section>


<section class="section max-w-7xl mx-auto px-6">
<div class="grid md:grid-cols-4 gap-10">

<div class="text-center p-6 shadow-sm rounded-xl">
<img src="images/pawan-agarwal.jpg" class="rounded-full mx-auto mb-4 w-32 h-32 object-cover">
<h3 class="font-semibold">CA Pawan K. Agarwal</h3>
</div>

<div class="text-center p-6 shadow-sm rounded-xl">
<img src="images/pawan-agrawal2.jpg" class="rounded-full mx-auto mb-4 w-32 h-32 object-cover">
<h3 class="font-semibold">CA Pawan Agrawal</h3>
</div>

<div class="text-center p-6 shadow-sm rounded-xl">
<img src="images/saket-sanganeria.jpg" class="rounded-full mx-auto mb-4 w-32 h-32 object-cover">
<h3 class="font-semibold">CA Saket Sanganeria</h3>
</div>

<div class="text-center p-6 shadow-sm rounded-xl">
<img src="images/bina-rathi.jpg" class="rounded-full mx-auto mb-4 w-32 h-32 object-cover">
<h3 class="font-semibold">CA Bina Rathi</h3>
</div>

</div>
</section>


<div id="footer"></div>

<script>
fetch("header.html").then(r=>r.text()).then(d=>document.getElementById("header").innerHTML=d);
fetch("footer.html").then(r=>r.text()).then(d=>document.getElementById("footer").innerHTML=d);
</script>

</body>
</html>
